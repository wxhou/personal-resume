<!DOCTYPE html>
<html lang="zh-CN">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Bigger蓝莓 - AI应用工程师</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Bigger蓝莓",
      "jobTitle": "AI应用工程师",

    <!-- 默认主题：/resume 优先用简历主题记忆（避免首帧站点明暗闪烁）；首页用站点记忆，否则跟随系统 prefers-color-scheme -->
    <script>
      try {
        var RESUME_THEMES = ['original', 'dark', 'editorial', 'geometric']
        var isResume = location.pathname === '/resume' || location.pathname.indexOf('/resume/') === 0
        var t
        if (isResume) {
          var r = localStorage.getItem('resume-theme')
          t = RESUME_THEMES.indexOf(r) > -1 ? r : 'original'
        } else {
          t = localStorage.getItem('siteTheme')
            || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
      document.documentElement.dataset.route = location.pathname === '/' ? 'home' : 'page'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
